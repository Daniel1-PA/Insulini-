name: insulini

services:
  frontend:
    build: ./Insulini.App
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./Insulini.App:/app
      - /app/node_modules

  api:
    build:
      context: ./Insulini.Api
      dockerfile: Insulini.Api/Dockerfile
    ports:
      - "8000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  database:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: insulini
      POSTGRES_USER: insulini
      POSTGRES_PASSWORD: insulini
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
