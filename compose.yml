name: insulini

services:
  frontend:
    build: ./Insulini.App
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./Insulini.App:/app
      - /app/node_modules

  api:
    build:
      context: ./Insulini.Api
      dockerfile: Insulini.Api/Dockerfile
    ports:
      - "8000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=database;Port=5432;Database=insulini;Username=insulini;Password=insulini
      AllowedOrigins__0: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: insulini
      POSTGRES_USER: insulini
      POSTGRES_PASSWORD: insulini
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insulini -d insulini"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
